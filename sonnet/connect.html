<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Connect Google Calendar · Secretary Agent</title>
<link rel="stylesheet" href="style.css">
<style>
  .box { margin-top: 24px; padding: 20px; border: 1px solid var(--rule); border-radius: 12px; }
  .big { font-size: 1.35rem; font-weight: 600; margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Secretary Agent <span class="sub">(Ate Sonnet)</span></h1>
  <div class="box" id="box">
    <p class="big" id="title">Connecting…</p>
    <p id="text">Please wait a moment.</p>
  </div>
  <footer><a href="index.html">About</a> · <a href="privacy.html">Privacy policy</a></footer>
</main>
<script>
// Google sent the person here after they allowed (or declined) Calendar access. Hand the one-time code to the
// connect helper, which Sonnet's PC picks up; then clear it from the address bar. Nothing is stored on this page.
const HELPER = "https://sonnet-connect.agentsonnet.workers.dev";
const q = new URLSearchParams(location.search);
const state = q.get("state") || "", code = q.get("code") || "", error = q.get("error") || "";
history.replaceState(null, "", location.pathname);
function show(title, text) {
  document.getElementById("title").textContent = title;
  document.getElementById("text").textContent = text;
}
if (!/^[0-9a-f]{32}$/.test(state) || (!code && !error)) {
  show("Nothing to connect here", "Open this from the Connect Google Calendar button in your chat with Ate Sonnet on Telegram.");
} else {
  fetch(HELPER + "/deposit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(code ? { state, code } : { state, error: error.slice(0, 100) }),
  }).then(r => {
    if (!r.ok) throw new Error(String(r.status));
    if (error) show("Not connected", "You didn't allow Calendar access, so nothing was connected. You can close this page and go back to Telegram.");
    else show("✅ Almost done", "Go back to Telegram: Ate Sonnet will confirm in a few seconds. If she hasn't after a minute, the link had expired; send /gcal connect for a new one.");
  }).catch(() => {
    show("Something went wrong", "Please go back to Telegram and send /gcal connect to try again.");
  });
}
</script>
</body>
</html>
